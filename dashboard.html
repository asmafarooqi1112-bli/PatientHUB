<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PatientHUB</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="dashboard.css">
    <script src="app.js" defer></script>
</head>

<body>

    //sidebar

    <aside class="sidebar">

        <div class="logo">
     <img src="images/logo.jpeg" alt="PatientHUB logo">
      <span>PatientHUB</span>
        </div>

        <div class="sidebar-divider"></div>

        <nav class="sidebar-menu">

      <a href="#" class="menu-item active">
        <i class="fa-solid fa-house"></i>
       <span>Dashboard</span>
      </a>

       <a href="#" class="menu-item">
        <i class="fa-regular fa-calendar-days"></i>
      <span>Appointments</span>
       </a>

     <a href="#" class="menu-item">
     <i class="fa-solid fa-user-doctor"></i>
     <span>Find Doctor</span>
      </a>

     <a href="#" class="menu-item">
      <i class="fa-solid fa-hospital"></i>
     <span>Find Clinic</span>
      </a>

      <a href="#" class="menu-item">
     <i class="fa-solid fa-comments"></i>
     <span>Chat</span>
      </a>

       <a href="#" class="menu-item">
       <i class="fa-solid fa-shop"></i>
       <span>Find MarketPlace</span>
       </a>

      <a href="#" class="menu-item">
     <i class="fa-solid fa-tablets"></i>
     <span>Find Pharmacy</span>
      </a>

      <a href="#" class="menu-item">
       <i class="fa-solid fa-children"></i>
        <span>My Dependents</span>
       </a>

        <a href="#" class="menu-item">
              
      <i class="fa-solid fa-circle-user"></i>
        
       <span>My Account</span>

      </a>
        <a href="#" class="menu-item">
       <i class="fa-solid fa-gear"></i>
       <span>Settings</span>
       </a>

        </nav>

        <button class="help-button" type="button">
       <span>?</span>
        </button>

        <div class="sidebar-resizer"></div>

    </aside>

</body>




//Navbar

<div class="Navbar">

    <div class="navbar-title">
        <p>Dashboard / <i class="fa-solid fa-house"></i></p>
        <h1>Dashboard</h1>
    </div>

    <i class="fa-solid fa-bars navbar-menu-icon"></i>

    <div class="navbar-right">

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="...Type here">
        </div>

        <div class="logout">
            <i class="fa-solid fa-user"></i>
            <span>Log out</span>
        </div>

        <i class="fa-solid fa-gear navbar-icon"></i>

        <i class="fa-solid fa-bell navbar-icon"></i>

    </div>

</div>
