<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PatientHUB</title>

    <link rel="stylesheet" href="style.css">
     
    <script src="app.js" defer></script>
</head>

<body>

    <header class="hero">

        <h1>Welcome to PatientHUB!</h1>

        <p>We provide smart healthcare services in your hands.</p>

    </header>


    <main class="main-content">

    <div class="login-card">

    <h2>Sign in to PatientHUB</h2>


    <form>

   
    <div class="social-login">

    <button type="button">
        <img src="images/photo 1.jpeg" alt="Facebook">
    </button>

    <button type="button">
        <img src="images/photo.jpeg" alt="Google">
    </button>

    </div>

    <input
    type="text"
    placeholder="Email or Phone number">


    <input
    type="password"
    placeholder="Please enter your password"
    >


    <button type="submit" class="sign-in-button">
    SIGN IN
    </button>


    <div class="login-options">

    <a href="#">Forgot password?</a>


    <label>

    <input type="checkbox">

    Remember me

    </label>

    </div>


    <p class="or">or</p>

    <button type="button" class="sign-up-button">
     SIGN UP
    </button>

    </form>

    </div>

   </main>


   <footer class="footer">

       <a href="#">Google Play Store APP</a>

       <a href="#">App Store APP</a>

       <a href="#">About PatientHUB</a>

       <a href="#">About Us</a>

       <a href="#">Our Blog</a>

   </footer>




</body>

</html>
